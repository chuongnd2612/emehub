# Alembic configuration for the EmeHub backend.
#
# The real database URL is resolved at runtime from `app.config.settings`
# (EMEHUB_DATABASE_URL) inside `migrations/env.py`. The `sqlalchemy.url` below
# is a placeholder for the bare `alembic` CLI only.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url = postgresql+psycopg://postgres:postgres@localhost:5457/emehub

[post_write_hooks]

# No [loggers]/[handlers] section on purpose: migrations run inside the app's
# own boot path (app.db.run_migrations) and `fileConfig` would reset the root
# logger handlers the app just installed. See migrations/env.py.
