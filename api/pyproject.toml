[project]
name = "emehub-api"
version = "0.1.0"
description = "EmeHub — EMESOFT AI Operating Center (backend)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2",
    # Fernet for EMEHUB_ENCRYPTION_KEY (app/crypto.py) — never the JWT secret.
    "cryptography>=44.0.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.10.0",
    "pyotp>=2.9.0",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "httpx>=0.28.1",
    "ruff>=0.8.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "httpx>=0.28.1",
    "ruff>=0.8.4",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
