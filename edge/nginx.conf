# The EmeSoft suite's single front door.
#
# One origin, so the suite reads as one product rather than three sites that
# redirect to each other. The hub is the shell at `/`; each agent is mounted
# under a path prefix.
#
# ## Why the prefix is stripped here
#
# `proxy_pass` with a trailing slash rewrites `/qagent/runs/7` to `/runs/7`
# before it reaches q-agent's own nginx, so **that config is untouched** — it
# keeps seeing exactly the paths it sees today, including its `/api/`, `/auth/`
# and `/downloads/` locations and its SPA fallback. The prefix is a fact about
# the browser's URL bar, not about the app behind it.
#
# The app still has to *emit* prefixed URLs for its own assets, which is why
# q-agent is built with `VITE_BASE=/qagent/`. Stripping here and prefixing there
# are two halves of the same arrangement.
#
# ## What this deliberately does not do
#
# It does not terminate TLS and it does not authenticate. cloudflared already
# does the first, and the hub owns the second — a proxy that decided who may
# pass would be a second, weaker copy of the auth rules in `deps_auth.py`.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ## Why the upstreams are variables and not an `upstream {}` block
#
# nginx resolves a literal upstream host **once, at startup, and refuses to
# start if it does not resolve**. For a door fronting stacks that deploy on
# their own schedule that is exactly backwards: bring the edge up before
# q-agent, or `docker compose down` q-agent for a rebuild, and the front door
# dies — taking the hub down with it, for an unrelated reason.
#
# Putting the address in a variable defers resolution to request time, so a
# stack that is down produces a 502 on its own paths and nothing more. The cost
# is that `proxy_pass` with a variable no longer rewrites the URI, so each
# location below passes the path explicitly.
#
# 127.0.0.11 is Docker's embedded DNS. A short TTL because a container gets a
# new address every recreate, and a stale cached one is a 502 that outlives the
# restart that caused it.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 5190;
    server_name _;

    # The largest single upload in the suite is q-agent's (50m); the hub's own
    # nginx still enforces its stricter 20m for its own routes.
    client_max_body_size 50m;

    # ## Redirects must not describe the socket nginx is listening on
    #
    # By default nginx builds a redirect `Location` as `$scheme://$host:$server_port…`
    # — and behind cloudflared every one of those three is wrong. TLS terminates
    # upstream, so `$scheme` is `http`; the public port is 443, not the 5190 this
    # container listens on. A bare `/qagent` therefore answered
    # `http://hub.example:5190/qagent/`: a port not exposed to the internet, so the
    # browser hangs until it times out. It looks like the app is down.
    #
    # Off means a bare-path `Location: /qagent/`, which the browser resolves against
    # the URL it actually asked for — correct under any scheme, port or hostname,
    # with nothing here to keep in sync with the tunnel.
    absolute_redirect off;
    port_in_redirect off;

    # A bare `/qagent` has no trailing slash, so `location /qagent/` would not
    # match and it would fall through to the hub, which would answer its SPA and
    # then redirect to `/`.
    #
    # 307 rather than 308, though both keep the method and body: 308 is
    # *permanent*, and browsers cache it indefinitely without re-asking. While the
    # `Location` above was wrong, every client that hit this URL cached the broken
    # target and kept timing out long after the server was fixed — the fix could
    # not reach them, because they never sent another request. A temporary
    # redirect costs one round trip per visit and cannot outlive its own mistake.
    location = /qagent { return 307 /qagent/; }

    # A regex location so the captured remainder can be passed explicitly —
    # `proxy_pass` with a variable does no URI rewriting of its own, so this is
    # what strips the `/qagent` prefix.
    location ~ ^/qagent/(?<qagent_path>.*)$ {
        set $qagent_web "http://qagent-web:5174";
        proxy_pass $qagent_web/$qagent_path$is_args$args;
        # The app behind this emits absolute redirects too — nginx does it for any
        # directory asked for without its trailing slash — and those name the
        # internal container, which no browser can reach. `proxy_redirect default`
        # cannot help here: it derives the rewrite from a literal `proxy_pass`, and
        # ours is a variable. Naming the upstream explicitly keeps the rewrite
        # narrow, so a genuine off-site redirect still passes through untouched.
        proxy_redirect http://qagent-web:5174/ /qagent/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # q-agent runs Claude for up to half an hour; its own nginx allows 1800s
        # and a shorter limit here would cut the run off at the front door.
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # ── D-Agent ──────────────────────────────────────────────────────────────
    #
    # Mounted at `/dagent`, so the suite reads as one product. It gets here by a
    # different route from q-agent above, and the difference is worth stating.
    #
    # q-agent is a static bundle: `VITE_BASE` changes the URLs it *emits*, this
    # door strips the prefix, and its own nginx never learns the mount exists.
    # D-Agent is a Next **server**. Its prefix is compiled in as `basePath`
    # (dagent/Dockerfile), and the server then expects that prefix on every
    # request — so this location passes `$request_uri` through **unstripped**,
    # which is the opposite of the block above. Next handles its pages, its
    # assets and its route handlers under the prefix by itself.
    #
    # Two things it does not handle, patched here.
    #
    # ## Why one regex location and no bare-`/dagent` redirect
    #
    # The q-agent block above redirects `/qagent` to `/qagent/` because its
    # static server wants the slash. Next wants the opposite: under a basePath it
    # answers `/dagent/` with a 308 to `/dagent`, so a nginx redirect pointing the
    # other way is an infinite loop — and it *is* infinite, not merely wasteful:
    # ERR_TOO_MANY_REDIRECTS on the mount's own front door, which is how this was
    # found. Both forms are proxied instead and the app canonicalises, once.
    location ~ ^/dagent(?:/.*)?$ {
        set $dagent_web "http://dagent-web:3000";
        proxy_pass $dagent_web$request_uri;

        # ## Patch 1 — the auth gate's redirect loses the prefix
        #
        # `proxy.ts` sends an unauthenticated page request to `new URL("/login",
        # request.url)`, and a plain URL built that way drops the basePath. The
        # app answers `Location: /login`, which on this origin is the **hub's**
        # login screen. Rewriting the header here is the narrowest available fix.
        proxy_redirect /login /dagent/login;
        # And the absolute redirects nginx-behind-Next emits for a directory
        # asked for without its slash, which name a container no browser reaches.
        proxy_redirect http://dagent-web:3000/ /dagent/;

        # ## Patch 2 — root-relative API calls in client code
        #
        # `basePath` prefixes what the framework emits; it does not touch string
        # literals, and D-Agent's client code has ~48 `fetch("/api/…")` calls and
        # one `EventSource`. On this shared origin every one of them resolves to
        # `/api/…` — the **hub's** API — and returns 401 or 404 for reasons the
        # user cannot act on.
        #
        # So the document gets a shim that prefixes root-relative requests before
        # they leave the page. It is injected into `<head>` ahead of the app's own
        # scripts, so nothing runs before it, and it skips URLs already under the
        # prefix so Next's own traffic is untouched.
        #
        # **This is a workaround for another repo's code, and it should not
        # outlive it.** The real fix is one `apiFetch()` helper in D-Agent
        # (docs/DAGENT-HANDOFF.md § 2, ticket-executor#93); when that ships, both
        # patches in this block are deleted and only the proxy remains. Until
        # then, the alternative was leaving D-Agent off the shared origin
        # entirely.
        #
        # Accept-Encoding is cleared because sub_filter cannot rewrite a
        # compressed body — Next gzips by default, and without this the filter
        # silently does nothing.
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter '<head>' '<head><script>(function(){var B="/dagent";function fix(u){return (typeof u==="string"&&u.charAt(0)==="/"&&u.indexOf(B+"/")!==0&&u.indexOf("//")!==0)?B+u:u;}var f=window.fetch;window.fetch=function(i,o){if(typeof i==="string")i=fix(i);else if(typeof Request!=="undefined"&&i instanceof Request&&i.url.indexOf(location.origin)===0){var p=i.url.slice(location.origin.length);var q=fix(p);if(q!==p)i=new Request(location.origin+q,i);}return f.call(this,i,o);};var x=window.XMLHttpRequest&&window.XMLHttpRequest.prototype.open;if(x)window.XMLHttpRequest.prototype.open=function(){arguments[1]=fix(arguments[1]);return x.apply(this,arguments);};var E=window.EventSource;if(E){function S(u,c){return new E(fix(u),c);}S.prototype=E.prototype;window.EventSource=S;}})();</script>';

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A run streams its Claude log over SSE for as long as the run lasts, so
        # the same half-hour budget q-agent gets. Buffering off, or the browser
        # sees a run's log arrive all at once when it finishes.
        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # The hub is the shell and owns everything else, including `/api` (its own)
    # and its SPA fallback.
    location / {
        set $emehub_web "http://emehub-web:5180";
        # `$request_uri` rather than a bare variable: with a variable upstream
        # nginx passes no URI at all, and every request would land on `/`.
        proxy_pass $emehub_web$request_uri;
        # Same reasoning as the agent location above.
        proxy_redirect http://emehub-web:5180/ /;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
