# EmeHub web tier: serve the built SPA and reverse-proxy the API to the
# backend, so the whole app stays one origin (exactly like the Vite dev proxy).
# Included inside nginx's http{} block, so the `map` below is valid here.

# WebSocket upgrade switch: forward `Connection: upgrade` only for WS requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The api service on the compose network.
upstream emehub_api {
    server api:8790;
}

server {
    listen 5180;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Claude .credentials.json uploads flow through here.
    client_max_body_size 20m;

    # Self-hosted fonts and brand assets are immutable, content-addressed by
    # Vite for the JS/CSS and stable-named under /fonts and /assets.
    location /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Vite content-addresses everything here, so a changed file has a changed name
    # and this can never go stale. Cache it hard and never revalidate — which is
    # also strictly better than the four hours Cloudflare was guessing on our
    # behalf while the origin stated no policy at all (#153).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA client-side routes (/app, /app/projects, …) fall back to index.html.
    #
    # `no-cache` on the document is what makes a deploy reachable (#153). Without
    # it this response carries only `Last-Modified`, which is *heuristically*
    # cacheable: a browser may invent a freshness lifetime and serve index.html
    # without asking. index.html is the only file that names the hashed bundle, so
    # a stale copy pins that browser to the previous deploy's JS — which is still
    # on disk and still answers 200, so nothing looks broken and the fix simply
    # never arrives. Two separate fixes were reported as "still not working" for
    # exactly this reason, while the server was serving the new code correctly.
    #
    # `no-cache`, not `no-store`: the browser may keep the file, it just has to
    # revalidate. That costs one 304 with no body, and catches every deploy.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Same-origin API. The trailing slash on proxy_pass strips the /api prefix,
    # so the backend sees the same paths as in dev.
    location /api/ {
        proxy_pass http://emehub_api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
